
      - name: Build Angular and inspect output
        run: |
          npm ci
          npm run build
          echo "=== Generated index.html files ==="
          find dist -name index.html -print

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_FLOWER_0BF6FB710 }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist/portfolio/browser"
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
